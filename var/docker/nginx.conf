user                            www;
worker_processes                auto; # it will be determinate automatically by the number of core

events {
    worker_connections          1024;
}

http {
    include                     /etc/nginx/mime.types;
    default_type                application/octet-stream;
    sendfile                    on;
    access_log                  /var/log/nginx/access.log;
    client_max_body_size 2G;
    # Omnia: `localhost` resolves to ::1 first inside the container; nginx then
    # round-robins an address nothing listens on and, after one refused connect,
    # marks it down — a burst of chunk requests ended in "no live upstreams" and
    # an unstyled page. Pin IPv4 and never mark the single upstream as failed.
    upstream omnia_backend  { server 127.0.0.1:3000 max_fails=0; }
    upstream omnia_frontend { server 127.0.0.1:4200 max_fails=0; }
    server {
        listen 5000;
        server_name _;
        gzip on;
        gzip_types text/plain text/css application/json application/javascript text/xml application/xml application/xml+rss text/javascript;

        # Omnia: the studio lives under the dashboard's own origin at /social/ (Next.js basePath,
        # baked at build time — NEXT_PUBLIC_BASE_PATH in Dockerfile.dev). The API is /social/api/.
        # Relative Location headers: behind Caddy / a host port the container's own :5000 must never leak.
        absolute_redirect off;
        location = / { return 302 /social/; }
        # The basePath root: Next 308s `/social/` to `/social` and then 404s it (no `/` page under a
        # basePath), so nginx sends it on to the calendar; the studio's own middleware takes it from
        # there (signed-in → calendar, signed-out → /social/auth/login).
        location = /social { return 302 /social/launches; }
        location /social/api/ {
            proxy_pass http://omnia_backend/;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header Reload $http_reload;
            proxy_set_header Onboarding $http_onboarding;
            proxy_set_header Activate $http_activate;
            proxy_set_header Auth $http_auth;
            proxy_set_header Showorg $http_showorg;
            proxy_set_header Impersonate $http_impersonate;
            proxy_set_header Accept-Language $http_accept_language;
        }

        location /social/uploads/ {
            alias /uploads/;
            add_header X-Content-Type-Options "nosniff" always;
            add_header Content-Security-Policy "default-src 'none'; img-src 'self'; media-src 'self'; style-src 'none'; script-src 'none'; frame-ancestors 'none'; sandbox" always;
            types {
                image/jpeg jpg jpeg;
                image/png png;
                image/gif gif;
                image/webp webp;
                image/avif avif;
                image/bmp bmp;
                image/tiff tif tiff;
                video/mp4 mp4;
            }
            default_type application/octet-stream;
        }

        location /social/ {
            proxy_pass http://omnia_frontend;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header Reload $http_reload;
            proxy_set_header Onboarding $http_onboarding;
            proxy_set_header Activate $http_activate;
            proxy_set_header Auth $http_auth;
            proxy_set_header Showorg $http_showorg;
            proxy_set_header Impersonate $http_impersonate;
            proxy_set_header Accept-Language $http_accept_language;
            proxy_set_header i18next $http_i18next;
        }
    }
}